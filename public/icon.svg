<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="96" fill="#3B2618"/>
  <rect x="44" y="44" width="424" height="424" rx="64" stroke="#C89B62" stroke-width="6" fill="#4A301F"/>
  <!-- 5x5 Bagh-Chal Grid -->
  <g stroke="#E7D8C1" stroke-width="6" stroke-linecap="round" opacity="0.88">
    <!-- Outer & inner box lines -->
    <line x1="112" y1="112" x2="400" y2="112"/>
    <line x1="112" y1="184" x2="400" y2="184"/>
    <line x1="112" y1="256" x2="400" y2="256"/>
    <line x1="112" y1="328" x2="400" y2="328"/>
    <line x1="112" y1="400" x2="400" y2="400"/>
    <line x1="112" y1="112" x2="112" y2="400"/>
    <line x1="184" y1="112" x2="184" y2="400"/>
    <line x1="256" y1="112" x2="256" y2="400"/>
    <line x1="328" y1="112" x2="328" y2="400"/>
    <line x1="400" y1="112" x2="400" y2="400"/>
    <!-- Main Diagonals -->
    <line x1="112" y1="112" x2="400" y2="400"/>
    <line x1="400" y1="112" x2="112" y2="400"/>
    <!-- Diamond Diagonals -->
    <line x1="256" y1="112" x2="112" y2="256"/>
    <line x1="256" y1="112" x2="400" y2="256"/>
    <line x1="112" y1="256" x2="256" y2="400"/>
    <line x1="400" y1="256" x2="256" y2="400"/>
  </g>
  <!-- Four Corner Tigers -->
  <circle cx="112" cy="112" r="22" fill="#B45309" stroke="#FDE68A" stroke-width="5"/>
  <circle cx="400" cy="112" r="22" fill="#B45309" stroke="#FDE68A" stroke-width="5"/>
  <circle cx="112" cy="400" r="22" fill="#B45309" stroke="#FDE68A" stroke-width="5"/>
  <circle cx="400" cy="400" r="22" fill="#B45309" stroke="#FDE68A" stroke-width="5"/>
  <!-- Center Goat -->
  <circle cx="256" cy="256" r="20" fill="#FBF9F5" stroke="#1C1917" stroke-width="5"/>
</svg>
